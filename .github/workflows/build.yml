# Builds the Android app (APK), the Windows app (exe) and the Mac app on every push,
# then puts all three on the repo's Releases page under a fixed "latest" release.
# If a build fails, its error log is posted as a comment on the commit.
name: Build

on:
  push:
  workflow_dispatch:

jobs:
  android:
    name: Android app (APK)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --org pk.blanketremote --project-name blanket_remote . 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Apply Blanket Remote settings (permissions, name, icon, vibration bridge)
        run: python3 tool/patch_android.py 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - run: flutter pub get 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Unit tests
        run: flutter test 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      # Every build must be signed with the same key, or Android refuses to install an update over the
      # app already on the phone ("package appears to be invalid"). The key lives in the repo secret
      # ANDROID_DEBUG_KEYSTORE (base64 keystore, alias androiddebugkey, password android), never in the code.
      - name: Use the permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            keytool -list -keystore ~/.android/debug.keystore -storepass android | grep -i "fingerprint" | tee -a "$RUNNER_TEMP/build.log"
          else
            echo "::warning::Secret ANDROID_DEBUG_KEYSTORE is missing - this APK uses a temporary key and won't install over an earlier one"
          fi

      - name: Build APK
        run: flutter build apk --release 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - uses: actions/upload-artifact@v4
        with:
          name: BlanketRemote-android
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Post the error log on the commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          log=$(tail -c 60000 "$RUNNER_TEMP/build.log" 2>/dev/null || echo "no log")
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -f body="$(printf '**%s failed**\n\n```\n%s\n```' "$GITHUB_JOB" "$log")" > /dev/null

  windows:
    name: PC app (Windows exe)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: pc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - run: go test ./... 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Build exe
        run: GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-H windowsgui -s -w -X main.build=${GITHUB_SHA::7}" -o BlanketRemote.exe . 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - uses: actions/upload-artifact@v4
        with:
          name: BlanketRemote-windows
          path: pc/BlanketRemote.exe

      - name: Post the error log on the commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          log=$(tail -c 60000 "$RUNNER_TEMP/build.log" 2>/dev/null || echo "no log")
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -f body="$(printf '**%s failed**\n\n```\n%s\n```' "$GITHUB_JOB" "$log")" > /dev/null

  mac:
    name: PC app (Mac)
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: pc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build for Apple Silicon and Intel Macs
        run: |
          mkdir -p build
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.build=${GITHUB_SHA::7}" -o build/arm64 . 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 CC="clang -arch x86_64" go build -trimpath -ldflags "-s -w -X main.build=${GITHUB_SHA::7}" -o build/amd64 . 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          lipo -create -output build/BlanketRemote build/arm64 build/amd64
          lipo -info build/BlanketRemote | tee -a "$RUNNER_TEMP/build.log"

      - name: Make Blanket Remote.app
        run: |
          APP="build/Blanket Remote.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build/BlanketRemote "$APP/Contents/MacOS/BlanketRemote"
          cp res/mac/Info.plist "$APP/Contents/Info.plist"
          iconutil -c icns res/mac/AppIcon.iconset -o "$APP/Contents/Resources/AppIcon.icns" 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          codesign --force --deep --sign - "$APP" 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          codesign --verify --verbose "$APP" 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          cd build && ditto -c -k --keepParent "Blanket Remote.app" BlanketRemote-Mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BlanketRemote-mac
          path: pc/build/BlanketRemote-Mac.zip

      - name: Post the error log on the commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          log=$(tail -c 60000 "$RUNNER_TEMP/build.log" 2>/dev/null || echo "no log")
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -f body="$(printf '**%s failed**\n\n```\n%s\n```' "$GITHUB_JOB" "$log")" > /dev/null

  # One permanent link per file: https://github.com/<owner>/<repo>/releases/latest/download/<file>
  release:
    name: Publish download links
    needs: [android, windows, mac]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out

      - name: Replace the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv out/BlanketRemote-android/app-release.apk BlanketRemote.apk
          mv out/BlanketRemote-windows/BlanketRemote.exe BlanketRemote.exe
          mv out/BlanketRemote-mac/BlanketRemote-Mac.zip BlanketRemote-Mac.zip
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest BlanketRemote.apk BlanketRemote.exe BlanketRemote-Mac.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Blanket Remote - latest build" \
            --notes "Phone: BlanketRemote.apk (Android). Windows PC: BlanketRemote.exe. Mac: BlanketRemote-Mac.zip (unzip, move Blanket Remote to Applications, then open it). Built from commit ${GITHUB_SHA::7}."
