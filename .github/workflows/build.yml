# Builds the Android app (APK) and the Windows PC app (exe) on every push.
# Download them from the run's page on GitHub: Actions -> latest run -> Artifacts.
name: Build

on:
  push:
  workflow_dispatch:

jobs:
  android:
    name: Android app (APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --org pk.blanketremote --project-name blanket_remote .

      - name: Apply Blanket Remote settings (permissions, name, icon, vibration bridge)
        run: python3 tool/patch_android.py

      - run: flutter pub get

      - name: Unit tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: BlanketRemote-android
          path: app/build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: PC app (Windows exe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - run: go test ./...

      - name: Build exe
        run: GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-H windowsgui -s -w" -o BlanketRemote.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: BlanketRemote-windows
          path: pc/BlanketRemote.exe

  # Puts both files on the repo's Releases page under a fixed "latest" release, so there is one
  # permanent link: https://github.com/<owner>/<repo>/releases/latest/download/BlanketRemote.apk
  release:
    name: Publish download links
    needs: [android, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out

      - name: Replace the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv out/BlanketRemote-android/app-release.apk BlanketRemote.apk
          mv out/BlanketRemote-windows/BlanketRemote.exe BlanketRemote.exe
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest BlanketRemote.apk BlanketRemote.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Blanket Remote - latest build" \
            --notes "Phone: download BlanketRemote.apk on your Android phone and install it. PC: run BlanketRemote.exe on Windows. Built from commit ${GITHUB_SHA::7}."
